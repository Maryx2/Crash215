<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Starblast Admin</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui;color:#fff;background:#070916;--cyan:#55edff;--line:rgba(255,255,255,.12)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#25205f,transparent 30%),#070916}.wrap{width:min(1100px,calc(100% - 28px));margin:auto;padding:32px 0}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.top a{color:#9aa2ca;text-decoration:none}.brand{font-weight:1000;letter-spacing:.13em}.brand i{color:var(--cyan);font-style:normal}.login,.panel{background:linear-gradient(145deg,#12162f,#0c0e20);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 80px #0006}.login{width:min(420px,100%);margin:10vh auto}.login h1{font-size:22px;margin:0 0 6px}.login p{color:#8990b2;font-size:12px}.field{margin:12px 0}.field label{display:block;font-size:9px;color:#8990b2;font-weight:900;letter-spacing:.09em;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);background:#080a18;color:#fff;border-radius:11px;padding:12px;outline:none}.field input:focus{border-color:#55edff88}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:1000;cursor:pointer;background:linear-gradient(135deg,#55edff,#72f0b0);color:#071014}.ghost{background:#171a35;color:#cbd0ee;border:1px solid var(--line)}.error{min-height:18px;color:#ff719d;font-size:10px;margin-top:8px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#11142b;border:1px solid var(--line);border-radius:15px;padding:15px}.stat small{font-size:8px;color:#7780a6;font-weight:900}.stat b{display:block;font-size:23px;margin-top:5px}.panel h2{font-size:12px;letter-spacing:.1em;margin:0 0 12px}.table{overflow:auto}.row{display:grid;grid-template-columns:1.2fr 1fr .7fr .7fr .9fr;gap:10px;padding:10px 6px;border-bottom:1px solid #ffffff10;font-size:11px}.row.head{font-size:8px;color:#7780a6;font-weight:900}.toolbar{display:flex;gap:8px;margin:0 0 14px;justify-content:flex-end}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row>*:nth-child(n+3){display:none}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">STARBLAST <i>ADMIN</i></div><a href="/">← Back to game</a></div>
<section class="login" id="loginBox"><h1>Administrator Login</h1><p>Authorized operators only.</p><form id="loginForm"><div class="field"><label>USERNAME</label><input id="username" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%">SIGN IN</button><div class="error" id="error"></div></form></section>
<section id="dash" class="hidden"><div class="toolbar"><button class="btn ghost" id="refresh">REFRESH</button><button class="btn ghost" id="logout">LOG OUT</button></div><div class="grid"><div class="stat"><small>PLAYERS</small><b id="players">—</b></div><div class="stat"><small>TOTAL LAUNCHES</small><b id="launches">—</b></div><div class="stat"><small>EJECTS</small><b id="ejects">—</b></div><div class="stat"><small>FAILURES</small><b id="failures">—</b></div></div><div class="panel"><h2>TOP PILOTS</h2><div class="table" id="rows"></div></div></section>
</div><script>
const $=s=>document.querySelector(s);
async function api(path,opts={}){const r=await fetch('/.netlify/functions/'+path,{credentials:'include',headers:{'content-type':'application/json'},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed');return data}
async function load(){try{const d=await api('admin-data');$('#loginBox').classList.add('hidden');$('#dash').classList.remove('hidden');$('#players').textContent=d.summary.players.toLocaleString();$('#launches').textContent=d.summary.launches.toLocaleString();$('#ejects').textContent=d.summary.ejects.toLocaleString();$('#failures').textContent=d.summary.failures.toLocaleString();$('#rows').innerHTML='<div class="row head"><span>USERNAME</span><span>SCORE</span><span>LEVEL</span><span>BEST ×</span><span>LAUNCHES</span></div>'+d.players.map(p=>`<div class="row"><span>${escapeHtml(p.username)}</span><span>${Number(p.total_score).toLocaleString()}</span><span>${p.level}</span><span>${Number(p.best_multiplier).toFixed(2)}×</span><span>${p.launches}</span></div>`).join('')}catch(e){$('#dash').classList.add('hidden');$('#loginBox').classList.remove('hidden')}}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#error').textContent='';try{await api('admin-auth',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});await load()}catch(err){$('#error').textContent=err.message}};
$('#refresh').onclick=load;$('#logout').onclick=async()=>{await api('admin-auth',{method:'DELETE'}).catch(()=>{});location.reload()};load();
</script></body></html>
